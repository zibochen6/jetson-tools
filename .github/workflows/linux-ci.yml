name: linux-ci

# Linux (Ubuntu 24.04 amd64) build + package + start smoke. No publishing;
# this is the fast feedback gate for the GTK embedded-desktop port.

on:
  workflow_dispatch:
  push:
    branches:
      - linux-port
      - main

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            freerdp3-dev \
            libcjson-dev libfuse3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libgl1 libegl1 \
            xvfb xauth dbus-x11
          echo "freerdp3: $(pkg-config --modversion freerdp3)"
          echo "gtk+-3.0: $(pkg-config --modversion gtk+-3.0)"
          echo "webkit2gtk-4.1: $(pkg-config --modversion libwebkit2gtk-4.1)"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build frontend (tauri::generate_context! needs dist/)
        run: pnpm build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build .deb
        run: pnpm tauri build --bundles deb

      - name: Inspect package
        run: |
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb)
          echo "deb=$DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | grep -E 'applications|icons' | head -20

      - name: Clean-container install + start smoke
        run: |
          DEB=$(ls "$PWD"/src-tauri/target/release/bundle/deb/*.deb)
          docker run --rm -v "$(dirname "$DEB"):/debs:ro" ubuntu:24.04 \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq xvfb xauth dbus-x11 libgl1 libegl1 >/dev/null
              apt-get install -y -qq /debs/*.deb >/dev/null
              if ldd /usr/bin/jetson-remote | grep -q "not found"; then
                echo "::error::missing shared libraries"
                ldd /usr/bin/jetson-remote | grep "not found"
                exit 1
              fi
              set +e
              WEBKIT_DISABLE_DMABUF_RENDERER=1 \
              WEBKIT_DISABLE_COMPOSITING_MODE=1 \
              LIBGL_ALWAYS_SOFTWARE=1 \
              timeout 20s xvfb-run -a dbus-run-session -- /usr/bin/jetson-remote
              code=$?
              set -e
              echo "smoke exit=$code (124 = still running at timeout)"
              test "$code" -eq 124
            '

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          if-no-files-found: ignore
          path: src-tauri/target/release/bundle/deb/*.deb