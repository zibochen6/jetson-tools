name: release

# Build & publish the macOS app on tag push (v*). The tag commit must have
# bumped the version in src-tauri/Cargo.toml + tauri.conf.json + package.json.
#
# NOTE: unsigned builds are blocked from direct LAN sockets by macOS local-
# network privacy (KI-004); since 0.2.1 the app creates its own loopback
# tunnel via the system ssh (KI-021), so no port routing is baked in anymore.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FreeRDP (bridge build dependency)
        run: brew install freerdp

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build app + dmg
        run: pnpm tauri build

      - name: Package app as updater asset
        run: |
          tar -czf "Jetson Remote.app.tar.gz" \
            -C src-tauri/target/release/bundle/macos "Jetson Remote.app"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DMG=src-tauri/target/release/bundle/dmg/*.dmg
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists, uploading assets"
            gh release upload "$TAG" $DMG "Jetson Remote.app.tar.gz" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" $DMG "Jetson Remote.app.tar.gz" \
              --repo "$GITHUB_REPOSITORY" --generate-notes --title "$TAG"
          fi