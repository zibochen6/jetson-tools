[package]
name = "jetson-remote"
version = "0.2.0"
description = "Zero-configuration remote desktop client for NVIDIA Jetson"
authors = ["you"]
edition = "2021"
default-run = "jetson-remote"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jetson_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63.1", default-features = false, features = ["ring", "rsa", "flate2", "serde"] }
tokio = { version = "1.53.1", features = ["time", "net", "rt", "macros", "sync", "process", "io-util"] }
sha2 = "0.11.0"
base64 = "0.23.1"
thiserror = "2.0.20"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

